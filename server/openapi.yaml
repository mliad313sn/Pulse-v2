        oldData: { type: object, nullable: true }
        newData: { type: object, nullable: true }
        createdAt: { type: string, format: date-time }

    SyncOperation:
      type: object
      required: [opId, seq, entity, op]
      properties:
        opId: { type: string, format: uuid, description: Client-generated; replays of an applied opId are idempotent no-ops }
        seq:
          type: integer
          description: Client-assigned strict ordering; the batch is processed in ascending seq (missing/duplicate seq -> whole batch 400)
        entity: { type: string, enum: [task, project, roadblock, milestone, workstream] }
        entityId: { type: string, format: uuid }
        op: { type: string, enum: [update, create] }
        baseVersion: { type: integer, description: ANY mismatch with the server version is a conflict (no LWW) }
        clientUpdatedAt: { type: string, format: date-time, description: Recorded for diagnostics only — never used for conflict resolution }
