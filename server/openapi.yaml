    SyncResult:
      type: object
      properties:
        opId: { type: string, nullable: true }
        seq: { type: integer }
        result:
          type: string
          enum: [applied, blocked, held]
          description: blocked = the FIRST failing op (halts the batch); held = later ops, untouched and unvalidated
        entity: { type: string, nullable: true }
        entityId: { type: string, nullable: true }
        serverState:
          type: object
          nullable: true
          description: Current server entity on VERSION_CONFLICT so the human can compare/reapply; NEVER present on concealed NOT_FOUND
        error:
          type: string
          nullable: true
          description: VERSION_CONFLICT | NOT_FOUND | FORBIDDEN | VALIDATION | DEPENDENCY_LOCKED | SECURITY_GATE when blocked
        message:
          type: string
          nullable: true
          description: Human-readable failure explanation when blocked

    SyncResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/SyncResult" }
        haltedAt:
          type: string
          nullable: true
          description: opId of the blocked op the batch halted at, or null when nothing blocked
        serverTime: { type: string, format: date-time }
