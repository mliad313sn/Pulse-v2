        earliestFinish: { type: string, format: date }
        latestStart: { type: string, format: date }
        latestFinish: { type: string, format: date }
        slackDays: { type: integer }
        critical:
          type: boolean
          description: slackDays === 0

    Schedule:
      type: object
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/ScheduleTask" }
        criticalPath:
          type: array
          description: Critical task ids in earliestStart order
          items: { type: string, format: uuid }

    GateRequirement:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
