openapi: 3.0.3
info:
  title: OpsPM360 API
  version: "1.5.0"
  description: |
    Offline-first project portfolio management for multi-site mining IT operations.
    Auth: server-side sessions — POST /auth/login sets the HttpOnly `ppm_session`
    cookie; `Authorization: Bearer <token>` is accepted as an alternative.
    Base roles: ADMIN, DIVISION_LEAD, CONTRIBUTOR, VIEWER (VIEWER is hard
    read-only). Project classification (internal/restricted/confidential)
    conceals unauthorized projects with uniform 404s.
    Governance invariants (OCC, dependency locking, InfoSec gates, audit) are enforced
    server-side and mirrored by PostgreSQL triggers.
    E01/E04: org admin (sites/divisions/org tree), portfolio foundations
    (pillars/portfolios/programs), project membership (one PM per project;
    membership-based writes and classification), server-generated immutable
    PRJ-YYYY-NNN codes, and per-user enterprise access scoping.
    E05/E08: G0-G5 gate engine (lifecycleStage only moves through gate
    requests + authorized decisions; G2 demands the steering privilege),
    immutable approval ledger, weighted milestones, and COMPUTED project
    progress (never writable).
    E07: workstreams (manage-or-lead writes), typed task dependencies
    (FS/SS/FF/SF + lagDays; acyclic per project — cycle-closing edges are
    refused; FS locks the successor until the predecessor is done, SS/FF/SF
    are scheduling-only), task scheduling fields (workstreamId,
    plannedStart/plannedFinish, estimatedHours) and the CPM schedule /
    critical-path endpoint.
    E10/E13: computed RAG health on every project (four explained signals —
    schedule, roadblocks, overdueWork, freshness — worst wins), manual RAG
    override (manage-level, reason >=30 chars, audited, MANUAL badge),
    change-based rag_snapshots trend history, and APPEND-ONLY project updates
    (POST + GET only; the freshness source; online-only — not a sync entity).
    E25/E26 (ADR-003 executed): the offline sync batch is an ORDERED command
    log (client-assigned integer seq, ascending processing, batch-level 400 on
    missing/duplicate seq). Strict OCC is the ONLY conflict behavior — the
    Last-Write-Wins path is deleted; any stale baseVersion is a conflict.
    Outcomes: applied | blocked (first failure, halts the batch; serverState
    on VERSION_CONFLICT) | held (later ops, untouched). Halts audit ONE
    SYNC_HALTED event; POST /sync/discard records an explicit audited
    SYNC_DISCARDED resolution.
servers:
  - url: http://localhost:4000/api
tags:
  - name: system
  - name: auth
  - name: users
  - name: org
  - name: portfolios
  - name: projects
  - name: milestones
  - name: workstreams
  - name: dependencies
  - name: gates
  - name: tasks
  - name: updates
  - name: health
  - name: roadblocks
  - name: approvals
  - name: sync
  - name: audit
  - name: reports

security:
  - sessionCookie: []
  - bearerToken: []

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }

  /auth/login:
    post:
      tags: [auth]
      summary: Local login (sets HttpOnly ppm_session cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Logged in; Set-Cookie ppm_session=<token>; HttpOnly; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  mustChangePassword: { type: boolean }
        "401":
          description: AUTH_FAILED — identical for unknown email and wrong password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: ACCOUNT_DISABLED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: ACCOUNT_LOCKED — detail.retryAfterSeconds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: RATE_LIMITED — max 10 attempts/min per IP+email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout (deletes the session, clears the cookie; idempotent)
      security: []
      responses:
        "204": { description: Logged out }

  /auth/me:
    get:
      tags: [auth]
      summary: Current identity
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/change-password:
    post:
      tags: [auth]
      summary: Change own password (clears mustChangePassword; revokes all OTHER sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, description: "min length PASSWORD_MIN_LENGTH (default 10)" }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/revoke-all:
    post:
      tags: [auth]
      summary: Revoke ALL own sessions (including the current one)
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/entra/login:
    get:
      tags: [auth]
      summary: Start Entra ID SSO (302 to Microsoft; 501 NOT_CONFIGURED without AZURE_* env)
      security: []
      responses:
        "302": { description: Redirect to the Entra authorization endpoint }
        "501":
          description: NOT_CONFIGURED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/entra/callback:
    get:
      tags: [auth]
      summary: Entra ID SSO callback (creates a normal session, 302 to /)
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302": { description: Session created; redirect into the app }
        "400": { $ref: "#/components/responses/Validation" }
        "403":
          description: ACCOUNT_DISABLED — unknown or deactivated local account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: NOT_CONFIGURED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users:
    get:
      tags: [users]
      summary: Full user directory (ADMIN only)
      responses:
        "200":
          description: All users incl. baseRole, privileges, isActive
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      summary: Create a user (ADMIN only; generated temporary password, mustChangePassword=true)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, division, baseRole]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                division: { type: string }
                site: { type: string, nullable: true }
                baseRole: { type: string, enum: [ADMIN, DIVISION_LEAD, CONTRIBUTOR, VIEWER] }
                privileges:
                  type: array
                  items: { type: string, enum: [security_reviewer, steering] }
      responses:
        "201":
          description: Created — temporaryPassword is returned ONCE and never logged
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  temporaryPassword: { type: string }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      tags: [users]
      summary: Update a user (ADMIN only; deactivating revokes their sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                baseRole: { type: string, enum: [ADMIN, DIVISION_LEAD, CONTRIBUTOR, VIEWER] }
                privileges:
                  type: array
                  items: { type: string, enum: [security_reviewer, steering] }
                isActive: { type: boolean }
                division: { type: string }
                site: { type: string, nullable: true }
                enterpriseAccess: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{id}/reset-password:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    post:
      tags: [users]
      summary: Reset a user's password (ADMIN only; revokes sessions, forces change)
      responses:
        "200":
          description: New temporary password — returned ONCE, never logged/audited
          content:
            application/json:
              schema:
                type: object
                properties:
                  temporaryPassword: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{id}/unlock:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    post:
      tags: [users]
      summary: Clear a user's login-failure lockout (ADMIN only)
      responses:
        "204": { description: Unlocked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sites:
    get:
      tags: [org]
      summary: List sites (any authenticated user)
      responses:
        "200":
          description: Sites
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Site" }
    post:
      tags: [org]
      summary: Create a site (ADMIN only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefDataCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /sites/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [org]
      summary: Update a site (ADMIN only; code rename allowed only while unreferenced)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefDataPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /divisions:
    get:
      tags: [org]
      summary: List divisions (any authenticated user)
      responses:
        "200":
          description: Divisions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Division" }
    post:
      tags: [org]
      summary: Create a division (ADMIN only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefDataCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Division" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /divisions/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [org]
      summary: Update a division (ADMIN only; code rename allowed only while unreferenced)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefDataPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Division" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /org/tree:
    get:
      tags: [org]
      summary: Admin Center overview — sites + divisions with users-per-division counts
      responses:
        "200":
          description: Org tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  sites:
                    type: array
                    items: { $ref: "#/components/schemas/Site" }
                  divisions:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Division"
                        - type: object
                          properties:
                            userCount: { type: integer }

  /pillars:
    get:
      tags: [portfolios]
      summary: List strategic pillars (any authenticated user)
      responses:
        "200":
          description: Pillars
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StrategicPillar" }
    post:
      tags: [portfolios]
      summary: Create a strategic pillar (ADMIN only; no delete endpoint exists)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategicPillar" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /pillars/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      tags: [portfolios]
      summary: Get a pillar
      responses:
        "200":
          description: Pillar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategicPillar" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [portfolios]
      summary: Update a pillar (ADMIN only; partial — no OCC version)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategicPillar" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /portfolios:
    get:
      tags: [portfolios]
      summary: List portfolios (any authenticated user)
      responses:
        "200":
          description: Portfolios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Portfolio" }
    post:
      tags: [portfolios]
      summary: Create a portfolio (ADMIN or DIVISION_LEAD)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortfolioCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Portfolio" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /portfolios/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      tags: [portfolios]
      summary: Get a portfolio
      responses:
        "200":
          description: Portfolio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Portfolio" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [portfolios]
      summary: Update a portfolio (ADMIN or DIVISION_LEAD; partial — no OCC version)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortfolioCreate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Portfolio" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /programs:
    get:
      tags: [portfolios]
      summary: List programs (any authenticated user)
      parameters:
        - name: portfolioId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Program" }
    post:
      tags: [portfolios]
      summary: Create a program (ADMIN or DIVISION_LEAD; portfolioId required)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Program" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /programs/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      tags: [portfolios]
      summary: Get a program
      responses:
        "200":
          description: Program
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Program" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [portfolios]
      summary: Update a program (ADMIN or DIVISION_LEAD; partial — no OCC version)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramCreate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Program" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bootstrap:
    get:
      tags: [system]
      summary: Everything the client caches into IndexedDB
      responses:
        "200":
          description: Bootstrap payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
                  tasks:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
                  roadblocks:
                    type: array
                    items: { $ref: "#/components/schemas/Roadblock" }
                  approvals:
                    type: array
                    items: { $ref: "#/components/schemas/SecurityApproval" }
                  milestones:
                    type: array
                    items: { $ref: "#/components/schemas/Milestone" }
                  workstreams:
                    type: array
                    items: { $ref: "#/components/schemas/Workstream" }
                  dependencies:
                    type: array
                    items: { $ref: "#/components/schemas/TaskDependency" }
                  updates:
                    type: array
                    items: { $ref: "#/components/schemas/ProjectUpdate" }
                    description: Capped at the latest 20 per project (newest first); full history via GET /projects/{id}/updates
                  pillars:
                    type: array
                    items: { $ref: "#/components/schemas/StrategicPillar" }
                  portfolios:
                    type: array
                    items: { $ref: "#/components/schemas/Portfolio" }
                  programs:
                    type: array
                    items: { $ref: "#/components/schemas/Program" }
                  serverTime: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /projects:
    get:
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [projects]
      summary: Create a project (ADMIN or DIVISION_LEAD; non-ADMIN classification is forced to internal)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: Created (re-read after write — a risk tag may already have flipped the security gate to pending)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      tags: [projects]
      summary: Get a project
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      summary: Update a project (OCC — body must include base `version`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectPatch" }
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Validation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }

  /projects/{id}/tasks:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      tags: [tasks]
      summary: Tasks of a project (includes derived `locked`)
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{id}/milestones:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      tags: [milestones]
      summary: Milestones of a project (concealed projects 404)
      responses:
        "200":
          description: Milestones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Milestone" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{id}/workstreams:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      tags: [workstreams]
      summary: Workstreams of a project (concealed projects 404)
      responses:
        "200":
          description: Workstreams
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workstream" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{id}/dependencies:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      tags: [dependencies]
      summary: Typed task dependencies of a project (concealed projects 404)
      responses:
        "200":
          description: Dependency edges
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskDependency" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{id}/schedule:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      tags: [dependencies]
      summary: >
        CPM schedule (forward/backward pass over tasks + typed dependencies).
        Calendar days, inclusive dates; duration = plannedFinish - plannedStart + 1
        (fallback 1 day); plannedStart is a start-no-earlier-than floor.
      responses:
        "200":
          description: Per-task schedule + critical path (taskIds in earliestStart order)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{id}/gates:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      tags: [gates]
      summary: Gate status for the project's current stage (War Room checklist)
      responses:
        "200":
          description: Current stage, next gate requirements, and any pending request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GateStatus" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{id}/gates/request:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    post:
      tags: [gates]
      summary: Request the next gate (manage-level authority required)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
                dispositionNote:
                  type: string
                  description: G5 only — explicit disposition of outstanding open work
      responses:
        "201":
          description: Pending gate request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GateRequest" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: GATE_REQUEST_PENDING — one is already open (detail.pendingRequestId)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: GATE_REQUIREMENTS_NOT_MET — detail.missing lists {key, label, detail?}
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /projects/{id}/ledger:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      tags: [gates]
      summary: Immutable approval ledger of the project (chronological; no mutation routes exist)
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LedgerEntry" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{id}/updates:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      tags: [updates]
      summary: Project updates, newest first (append-only history — E13)
      responses:
        "200":
          description: Project updates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectUpdate" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{id}/rag-history:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      tags: [health]
      summary: RAG trend snapshots, newest first (change-based, never fabricated — plan §133)
      responses:
        "200":
          description: Snapshots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RagSnapshot" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{id}/rag-override:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    post:
      tags: [health]
      summary: Set the manual RAG override (manage-level; reason >= 30 chars; audited — plan §25)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [color, reason]
              properties:
                color: { type: string, enum: [GREEN, AMBER, RED] }
                reason: { type: string, minLength: 30, description: Trimmed length must be >= 30 (else 400 RAG_OVERRIDE_REASON_TOO_SHORT) }
      responses:
        "200":
          description: Decorated project — rag.color = override, rag.manual set, rag.computedColor kept
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [health]
      summary: Clear the manual RAG override (manage-level; audited; idempotent)
      responses:
        "200":
          description: Decorated project — rag.manual null, effective color = computed again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /updates:
    post:
      tags: [updates]
      summary: >
        Post a project update (E13, plan §32) — APPEND-ONLY: no PATCH/DELETE
        routes exist anywhere (revisions arrive in a later slice) and updates
        are NOT part of the offline sync entity set (online-only). Writers:
        manage-level, project owner/sponsor, or contributing member
        (INFORMED/AUDITOR excluded); author is always the session user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, mood, text]
              properties:
                projectId: { type: string, format: uuid }
                mood: { type: string, enum: [POSITIVE, NEUTRAL, CONCERN, CRITICAL] }
                text: { type: string, maxLength: 400 }
                accomplishment: { type: string, nullable: true }
                nextStep: { type: string, nullable: true }
                supportRequired: { type: string, nullable: true }
      responses:
        "201":
          description: Created (immutable from now on)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectUpdate" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /milestones:
    get:
      tags: [milestones]
      summary: List milestones (classification/enterprise-filtered; optional ?projectId=)
      parameters:
        - name: projectId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Milestones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Milestone" }
    post:
      tags: [milestones]
      summary: Create a milestone (manage-level authority on the project)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestoneCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /milestones/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      tags: [milestones]
      summary: Update a milestone (manage-level OR the milestone owner; OCC `version` required)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestonePatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }

  /workstreams:
    get:
      tags: [workstreams]
      summary: List workstreams (classification/enterprise-filtered; optional ?projectId=)
      parameters:
        - name: projectId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Workstreams
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workstream" }
    post:
      tags: [workstreams]
      summary: Create a workstream (manage-level authority on the project)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkstreamCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workstream" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /workstreams/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      tags: [workstreams]
      summary: Update a workstream (manage-level OR the workstream lead; OCC `version` required)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkstreamPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workstream" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }

  /dependencies:
    get:
      tags: [dependencies]
      summary: List dependency edges (classification/enterprise-filtered; optional ?projectId=)
      parameters:
        - name: projectId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Dependency edges
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskDependency" }
    post:
      tags: [dependencies]
      summary: >
        Create a typed dependency edge (manage-level authority). Both tasks
        must share the same project; self-dependencies and edges that would
        close a cycle (transitively, across all types) are refused with 400;
        an identical (predecessor, successor, type) edge yields 409 DUPLICATE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskDependencyCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDependency" }
        "400":
          description: VALIDATION — unknown/cross-project task, bad type/lag, self-dependency, or dependency cycle (detail.path)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: DUPLICATE — this (predecessor, successor, type) edge already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /dependencies/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    delete:
      tags: [dependencies]
      summary: Delete a dependency edge (manage-level authority; unlocks an FS-locked successor)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /gate-requests:
    get:
      tags: [gates]
      summary: List gate requests (scoped to readable projects; optional ?status=PENDING)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED] }
      responses:
        "200":
          description: Gate requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GateRequest" }

  /gate-requests/{id}/decision:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    post:
      tags: [gates]
      summary: >
        Decide a pending gate request. G2 requires the steering privilege (an
        ADMIN without it gets 403 STEERING_APPROVAL_REQUIRED); other gates
        accept ADMIN, a steering holder, or a DIVISION_LEAD of the project's
        division. The requester can never decide their own request. APPROVED
        applies the lifecycle transition + appends the ledger entry in one
        transaction; REJECTED appends the ledger entry only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVED, REJECTED] }
                note: { type: string }
      responses:
        "200":
          description: Decision applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  gateRequest: { $ref: "#/components/schemas/GateRequest" }
                  project: { $ref: "#/components/schemas/Project" }
                  ledgerEntry: { $ref: "#/components/schemas/LedgerEntry" }
        "400": { $ref: "#/components/responses/Validation" }
        "403":
          description: FORBIDDEN (self-decision / no authority) or STEERING_APPROVAL_REQUIRED (G2)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{id}/members:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      tags: [projects]
      summary: Project members (anyone who can read the project; concealed otherwise)
      responses:
        "200":
          description: Membership rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectMember" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [projects]
      summary: Add a member (ADMIN, the project PM, or DIVISION_LEAD of the project's division). Role PM atomically swaps the incumbent (both audited). VIEWER can never be PM/WORKSTREAM_LEAD.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId: { type: string, format: uuid }
                role: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectMember" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{id}/members/{userId}/{role}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: role
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ProjectRole" }
    delete:
      tags: [projects]
      summary: Remove a membership (same authority as adding)
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks:
    get:
      tags: [tasks]
      summary: List tasks (includes derived `locked`)
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
    post:
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreate" }
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Validation" }

  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      tags: [tasks]
      summary: Get a task (includes derived `locked`)
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tasks]
      summary: Update a task (OCC + governance gates)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskPatch" }
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Validation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "423": { $ref: "#/components/responses/Gated" }

  /roadblocks:
    get:
      tags: [roadblocks]
      summary: List roadblocks
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Roadblocks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Roadblock" }
    post:
      tags: [roadblocks]
      summary: Log a roadblock (1-request field logging; severity defaults to medium)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoadblockCreate" }
      responses:
        "201":
          description: Created roadblock
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Roadblock" }
        "400": { $ref: "#/components/responses/Validation" }

  /roadblocks/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      tags: [roadblocks]
      summary: Update a roadblock (OCC)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoadblockPatch" }
      responses:
        "200":
          description: Updated roadblock
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Roadblock" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }

  /approvals:
    get:
      tags: [approvals]
      summary: List security approvals (InfoSec queue)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Approvals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SecurityApproval" }

  /approvals/{id}/decision:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    post:
      tags: [approvals]
      summary: Decide an approval (requires the security_reviewer PRIVILEGE; recomputes project gate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected]
                notes: { type: string, nullable: true }
      responses:
        "200":
          description: Decision applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval: { $ref: "#/components/schemas/SecurityApproval" }
                  project: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /audit:
    get:
      tags: [audit]
      summary: Read-only audit trail
      parameters:
        - name: entityId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Audit entries (immutable ledger)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }

  /sync:
    post:
      tags: [sync]
      summary: Offline batch sync (ordered command log; strict OCC — no LWW; halt on first failure)
      description: |
        Operations are processed strictly in ascending client-assigned `seq`
        order. The first failing op is `blocked` ({error, message,
        serverState?}) and every later op is `held` (untouched, not
        validated). Any stale baseVersion is a VERSION_CONFLICT — the machine
        never merges. Duplicate replays of applied ops are idempotent no-ops.
        A halted batch writes one SYNC_HALTED audit event. Missing/duplicate
        seq refuses the whole batch (400).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncRequest" }
      responses:
        "200":
          description: Per-operation results in seq order, plus haltedAt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResponse" }
        "400": { $ref: "#/components/responses/Validation" }

  /sync/discard:
    post:
      tags: [sync]
      summary: Record an explicit, audited discard of a queued offline op (SYNC_DISCARDED)
      description: |
        The op itself lives client-side; this endpoint is the server-side
        audit trail plan §57 requires for the human "discard" resolution of a
        halted queue. Attributed to the session user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opId, entity, entityId]
              properties:
                opId: { type: string, description: Client-generated op id being discarded }
                entity: { type: string }
                entityId: { type: string }
                reason: { type: string, nullable: true }
      responses:
        "204": { description: Discard recorded (audited) }
        "400": { $ref: "#/components/responses/Validation" }

  /reports/executive-deck:
    get:
      tags: [reports]
      summary: Executive deck download (active projects grouped by division)
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [pptx, pdf]
            default: pptx
      responses:
        "200":
          description: Binary deck (Content-Disposition attachment)
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Validation" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ppm_session
      description: Opaque session token set by POST /auth/login (HttpOnly; SameSite=Lax)
    bearerToken:
      type: http
      scheme: bearer
      description: The same session token, sent as Authorization Bearer

  parameters:
    EntityId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthenticated:
      description: Missing, invalid or expired session (AUTH_REQUIRED)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Role not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Entity missing
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Validation:
      description: Bad payload
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    VersionConflict:
      description: OCC mismatch — detail.serverState carries the current entity
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Gated:
      description: DEPENDENCY_LOCKED or SECURITY_GATE
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          enum: [AUTH_REQUIRED, AUTH_FAILED, ACCOUNT_LOCKED, ACCOUNT_DISABLED, RATE_LIMITED,
                 PASSWORD_CHANGE_REQUIRED, NOT_CONFIGURED, FORBIDDEN, NOT_FOUND, VERSION_CONFLICT,
                 DEPENDENCY_LOCKED, SECURITY_GATE, VALIDATION, DUPLICATE,
                 GATE_REQUIREMENTS_NOT_MET, STEERING_APPROVAL_REQUIRED, GATE_REQUEST_PENDING,
                 RAG_OVERRIDE_REASON_TOO_SHORT, INTERNAL]
        message: { type: string }
        detail:
          type: object
          nullable: true

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        division: { type: string, description: A division code (admin-extensible) }
        site: { type: string, nullable: true, description: A site code (admin-extensible) }
        baseRole: { type: string, enum: [ADMIN, DIVISION_LEAD, CONTRIBUTOR, VIEWER] }
        privileges:
          type: array
          items: { type: string, enum: [security_reviewer, steering] }
        isActive: { type: boolean }
        mustChangePassword: { type: boolean }
        enterpriseAccess:
          type: boolean
          description: When false, every read is scoped to own-site or member/owner/sponsor projects
        createdAt: { type: string, format: date-time }

    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          pattern: '^PRJ-\d{4}-\d{3,}$'
          description: Server-generated PRJ-YYYY-NNN, unique and immutable
        name: { type: string }
        description: { type: string, nullable: true }
        division: { type: string }
        site: { type: string, nullable: true, description: Primary site }
        sites:
          type: array
          items: { type: string }
          description: Additional site codes
        engagedDivisions:
          type: array
          items: { type: string }
        cgeitTag:
          type: string
          enum: [strategic_alignment, value_delivery, risk_optimization, resource_optimization, performance_measurement]
        strategicTag: { type: string, nullable: true }
        riskTags:
          type: array
          items: { type: string }
        classification:
          type: string
          enum: [internal, restricted, confidential]
          description: Read scoping (ADR-005) — unauthorized projects are concealed with uniform 404s
        overallStatus: { type: string, enum: [draft, active, at_risk, on_hold, complete] }
        lifecycleStage:
          type: string
          enum: [IDEA, INITIATION, PLANNING, EXECUTION, DEPLOYMENT, RUN, CLOSED]
          description: >
            Gate-governed (E05): forward movement only through
            POST /projects/{id}/gates/request + an authorized decision.
            Direct PATCH is 400 VALIDATION except the audited ADMIN
            one-step-backward correction.
        operatingStatus:
          type: string
          enum: [NOT_STARTED, IN_PROGRESS, ON_HOLD, COMPLETED, CANCELLED]
          description: >
            -> ON_HOLD requires holdReason; -> CANCELLED requires cancelReason
            and is TERMINAL (any later operating-status change is 400).
        securityGateStatus: { type: string, enum: [not_required, pending, approved, rejected] }
        ownerId: { type: string, format: uuid, nullable: true }
        portfolioId: { type: string, format: uuid, nullable: true }
        programId: { type: string, format: uuid, nullable: true }
        sponsorId: { type: string, format: uuid, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        targetDate: { type: string, format: date, nullable: true }
        actualEndDate: { type: string, format: date, nullable: true }
        acceptanceCriteria: { type: string, nullable: true }
        deploymentPlan: { type: string, nullable: true }
        supportOwnerId: { type: string, format: uuid, nullable: true }
        closureSummary: { type: string, nullable: true }
        cancelReason: { type: string, nullable: true }
        holdReason: { type: string, nullable: true }
        pmId:
          type: string
          format: uuid
          nullable: true
          description: Derived — the single PM member's userId, or null
        progress: { $ref: "#/components/schemas/Progress" }
        rag: { $ref: "#/components/schemas/Rag" }
        ragOverride:
          type: object
          nullable: true
          description: >
            Server-managed manual override storage ({color, reason, byId, at})
            — set/cleared ONLY via the rag-override endpoints, never PATCHable.
            The decorated view lives in rag.manual.
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    Rag:
      type: object
      description: >
        COMPUTED health (E10, plan §24-§26) — never writable. Worst active
        signal wins; while a manual override is active, color = the override
        color, manual is set (persistent MANUAL badge) and computedColor still
        reports the engine's result.
      properties:
        color: { type: string, enum: [GREEN, AMBER, RED], description: Effective color (override wins) }
        computedColor: { type: string, enum: [GREEN, AMBER, RED] }
        manual:
          type: object
          nullable: true
          properties:
            color: { type: string, enum: [GREEN, AMBER, RED] }
            reason: { type: string }
            byId: { type: string, format: uuid }
            at: { type: string, format: date-time }
        signals:
          type: array
          description: Always the four core signals, in order — schedule, roadblocks, overdueWork, freshness
          items: { $ref: "#/components/schemas/RagSignal" }
        explanation: { type: string, description: Human sentence for the headline color (plan §117) }

    RagSignal:
      type: object
      properties:
        key: { type: string, enum: [schedule, roadblocks, overdueWork, freshness] }
        label: { type: string }
        color: { type: string, enum: [GREEN, AMBER, RED] }
        explanation: { type: string }

    RagSnapshot:
      type: object
      description: >
        RAG trend history (plan §133) — appended lazily at read time whenever
        the effective or computed color differs from the project's last
        snapshot; append-only, never fabricated or backfilled.
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        color: { type: string, enum: [GREEN, AMBER, RED] }
        computedColor: { type: string, enum: [GREEN, AMBER, RED] }
        isManual: { type: boolean }
        capturedAt: { type: string, format: date-time }

    ProjectUpdate:
      type: object
      description: >
        APPEND-ONLY fast status pulse (E13, plan §32) and the RAG freshness
        source. No version/updatedAt — rows never change; no PATCH/DELETE
        routes exist. Not part of the offline sync entity set.
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        authorId: { type: string, format: uuid, description: Always the session user }
        mood: { type: string, enum: [POSITIVE, NEUTRAL, CONCERN, CRITICAL] }
        text: { type: string, maxLength: 400 }
        accomplishment: { type: string, nullable: true }
        nextStep: { type: string, nullable: true }
        supportRequired: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Progress:
      type: object
      description: >
        COMPUTED (plan §23, invariant 15) — never writable. percent =
        sum(weight of DONE non-CANCELLED milestones) / sum(weight of
        non-CANCELLED milestones) * 100; null when the project has no
        (active) milestones.
      properties:
        percent: { type: integer, nullable: true }
        completedWeight: { type: integer }
        activeWeight: { type: integer }
        explanation:
          type: string
          description: Numerator/denominator explanation ("No milestones yet" when empty)

    ProjectCreate:
      type: object
      required: [name, division]
      properties:
        name: { type: string }
        description: { type: string }
        division: { type: string }
        site: { type: string }
        cgeitTag: { type: string }
        strategicTag: { type: string }
        riskTags:
          type: array
          items: { type: string }
        classification:
          type: string
          enum: [internal, restricted, confidential]
          description: Only ADMIN may set it; forced to internal otherwise (403 on change)
        overallStatus: { type: string }
        ownerId: { type: string, format: uuid }
        portfolioId: { type: string, format: uuid, nullable: true }
        programId: { type: string, format: uuid, nullable: true }
        sponsorId: { type: string, format: uuid, nullable: true }
        lifecycleStage:
          type: string
          enum: [IDEA, INITIATION, PLANNING, EXECUTION, DEPLOYMENT, RUN, CLOSED]
        operatingStatus:
          type: string
          enum: [NOT_STARTED, IN_PROGRESS, ON_HOLD, COMPLETED, CANCELLED]
        engagedDivisions:
          type: array
          items: { type: string }
        sites:
          type: array
          items: { type: string }
        startDate: { type: string, format: date, nullable: true }
        targetDate: { type: string, format: date, nullable: true }
        actualEndDate: { type: string, format: date, nullable: true }
        acceptanceCriteria: { type: string, nullable: true }
        deploymentPlan: { type: string, nullable: true }
        supportOwnerId: { type: string, format: uuid, nullable: true }
        closureSummary: { type: string, nullable: true }
        cancelReason: { type: string, nullable: true }
        holdReason: { type: string, nullable: true }

    ProjectPatch:
      allOf:
        - $ref: "#/components/schemas/ProjectCreate"
      type: object
      required: [version]
      properties:
        version:
          type: integer
          description: Base version for OCC

    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        division: { type: string, nullable: true }
        site: { type: string, nullable: true }
        assigneeId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [todo, in_progress, blocked, done] }
        priority: { type: string, enum: [low, normal, high, critical] }
        dependencyLock:
          type: string
          format: uuid
          nullable: true
          description: Prerequisite task id; null = unlocked
        workstreamId:
          type: string
          format: uuid
          nullable: true
          description: Workstream of the task's OWN project (400 otherwise)
        plannedStart: { type: string, format: date, nullable: true }
        plannedFinish: { type: string, format: date, nullable: true }
        estimatedHours: { type: number, minimum: 0, nullable: true }
        riskTags:
          type: array
          items: { type: string }
        slaDueAt: { type: string, format: date-time, nullable: true }
        locked:
          type: boolean
          description: Derived — dependencyLock prerequisite or any FS predecessor not done, OR project security gate pending
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    TaskCreate:
      type: object
      required: [projectId, title]
      properties:
        projectId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        division: { type: string }
        site: { type: string }
        assigneeId: { type: string, format: uuid }
        status: { type: string }
        priority: { type: string }
        dependencyLock: { type: string, format: uuid, nullable: true }
        workstreamId: { type: string, format: uuid, nullable: true }
        plannedStart: { type: string, format: date, nullable: true }
        plannedFinish: { type: string, format: date, nullable: true }
        estimatedHours: { type: number, minimum: 0, nullable: true }
        riskTags:
          type: array
          items: { type: string }
        slaDueAt: { type: string, format: date-time }

    TaskPatch:
