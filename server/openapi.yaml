      type: object
      required: [version]
      properties:
        version:
          type: integer
          description: Base version for OCC

    TaskDependency:
      type: object
      description: >
        Immutable typed dependency edge (create/delete only). FS locks the
        successor until the predecessor is done; SS/FF/SF are scheduling-only.
        The per-project graph is acyclic across all types.
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        predecessorId: { type: string, format: uuid }
        successorId: { type: string, format: uuid }
        type: { type: string, enum: [FS, SS, FF, SF] }
        lagDays:
          type: integer
          description: Lag in days (negative = lead); default 0
        createdAt: { type: string, format: date-time }

    TaskDependencyCreate:
      type: object
      required: [predecessorId, successorId]
      properties:
        predecessorId: { type: string, format: uuid }
        successorId: { type: string, format: uuid }
        type: { type: string, enum: [FS, SS, FF, SF], default: FS }
        lagDays: { type: integer, default: 0 }

    ScheduleTask:
      type: object
      properties:
        taskId: { type: string, format: uuid }
